[package]
name = "black-hole-flux"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
black-hole-spec = { path = "../_black_hole_spec" }
futures = "0.3"
jungle-sdk = { workspace = true }
jungle-zoo = { workspace = true }
typosaurus = { workspace = true }
typenum = "1"
postcard = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }

[lints]
workspace = true
