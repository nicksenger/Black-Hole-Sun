[package]
name = "black-hole-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
black-hole-spec = { path = "../black-hole-spec" }
black-hole-void = { path = "../black-hole-void", default-features = false }
black-hole-quark = { path = "../black-hole-quark", features = ["qwen35_0p8b"] }

postcard = { version = "1", features = ["alloc"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
