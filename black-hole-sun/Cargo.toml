[package]
name = "black-hole-sun"
description = "Blackbox co-optimization of distributed agents"
version = "0.1.0"
edition = "2021"

[features]
test = ["dep:rustls"]
cuda = ["black-hole-mass/cuda"]
metal = ["black-hole-mass/metal"]
qwen35_0p8b = ["black-hole-mass/qwen35_0p8b"]
qwen35_2b = ["black-hole-mass/qwen35_2b"]
qwen35_4b = ["black-hole-mass/qwen35_4b"]
qwen35_9b = ["black-hole-mass/qwen35_9b"]
qwen35_27b = ["black-hole-mass/qwen35_27b"]
qwen38_27b = ["black-hole-mass/qwen38_27b"]

[dependencies]
black-hole-flux = { path = "../_black_hole_flux" }
black-hole-spec = { path = "../_black_hole_spec" }
black-hole-void = { path = "../_black_hole_void", default-features = false }
black-hole-mass = { path = "../_black_hole_mass" }
hf-hub = "0.4"
postcard = { version = "1", features = ["alloc"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
serde = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["io-util"] }

[lints]
workspace = true
