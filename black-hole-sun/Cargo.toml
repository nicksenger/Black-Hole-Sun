[package]
name = "black-hole-sun"
description = "Zeroth-Order Multi-Agent Co-Optimization"
version = "0.1.0"
edition = "2021"

[features]
cuda = ["black-hole-quark/cuda"]
metal = ["black-hole-quark/metal"]
qwen35_0p8b = ["black-hole-quark/qwen35_0p8b"]
qwen35_2b = ["black-hole-quark/qwen35_2b"]
qwen35_4b = ["black-hole-quark/qwen35_4b"]
qwen35_9b = ["black-hole-quark/qwen35_9b"]
qwen35_27b = ["black-hole-quark/qwen35_27b"]

[dependencies]
black-hole-flux = { path = "../_black_hole_flux" }
black-hole-spec = { path = "../_black_hole_spec" }
black-hole-void = { path = "../_black_hole_void", default-features = false }
black-hole-quark = { path = "../_black_hole_quark" }
hf-hub = "0.4"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[lints]
workspace = true
