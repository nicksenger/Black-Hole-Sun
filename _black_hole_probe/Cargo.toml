[package]
name = "black-hole-probe"
version = "0.1.0"
edition = "2021"

[features]
cuda = ["black-hole-sun/cuda"]
qwen35_0p8b = ["black-hole-sun/qwen35_0p8b"]
qwen35_2b = ["black-hole-sun/qwen35_2b"]
qwen35_4b = ["black-hole-sun/qwen35_4b"]
qwen35_9b = ["black-hole-sun/qwen35_9b"]
qwen35_27b = ["black-hole-sun/qwen35_27b"]

[dependencies]
black-hole-sun = { path = "../black-hole-sun" }

postcard = { version = "1", features = ["alloc"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }

[lints]
workspace = true

[dev-dependencies]
tracing = "0.1"
hf-hub = "0.4"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
