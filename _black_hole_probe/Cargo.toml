[package]
name = "black-hole-probe"
version = "0.1.0"
edition = "2021"

[features]
cuda = ["black-hole-sun/cuda"]
metal = ["black-hole-sun/metal"]
qwen35_0p8b = ["black-hole-sun/qwen35_0p8b"]
qwen35_2b = ["black-hole-sun/qwen35_2b"]
qwen35_4b = ["black-hole-sun/qwen35_4b"]
qwen35_9b = ["black-hole-sun/qwen35_9b"]
qwen35_27b = ["black-hole-sun/qwen35_27b"]

[dependencies]
async-trait = "0.1"
black-hole-sun = { path = "../black-hole-sun" }
futures = "0.3"
jungle-sdk = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }
typosaurus = { git = "https://github.com/nicksenger/typosaurus.git", branch = "jungle" }
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true

[[test]]
name = "sun"
path = "tests/sun/mod.rs"

[dev-dependencies]
black-hole-beam = { path = "../_black_hole_beam" }
tracing = "0.1"
