[package]
name = "black-hole-beam"
description = "UI for black-hole-sun"
version = "0.1.0"
edition = "2021"

[features]
piano = ["dep:clap", "dep:cpal", "dep:hound", "dep:midly", "dep:serde", "dep:serde_json"]

[dependencies]
async-trait = "0.1"
black-hole-flux = { path = "../_black_hole_flux" }
clap = { version = "4", features = ["derive"], optional = true }
cpal = { version = "0.17", optional = true }
hound = { version = "3.5", optional = true }
midly = { version = "0.5", default-features = false, features = ["std"], optional = true }
iced = { version = "0.14", features = ["advanced", "canvas", "tokio"] }
iced-sugiyama = { git = "https://github.com/nicksenger/iced-sugiyama.git", branch = "blackholesun", features = ["circo"] }
jungle-sdk = { workspace = true }
jungle-vision = { workspace = true }
postcard = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
typenum = "1"
uuid = { version = "1", features = ["serde"] }

[[bin]]
name = "black-hole-score"
required-features = ["piano"]

[[bin]]
name = "black-hole-play"
required-features = ["piano"]

[lints]
workspace = true
