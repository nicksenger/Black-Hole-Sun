[package]
name = "black-hole-contract"
description = "Typed tensor contracts and codecs for black-hole-sun"
version = "0.1.0"
edition = "2021"

[dependencies]
black-hole-spec = { path = "../_black_hole_spec" }
glowstick = "0.3"
postcard = { version = "1", features = ["alloc"] }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[lints]
workspace = true
