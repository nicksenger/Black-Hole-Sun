[package]
name = "black-hole-mass"
description = "Weight management for black-hole-sun"
version = "0.1.0"
edition = "2021"

[features]
metal = ["paramecia-engine/metal"]
qwen35_0p8b = ["paramecia-engine/qwen35_0p8b"]
qwen35_2b = ["paramecia-engine/qwen35_2b"]
qwen35_4b = ["paramecia-engine/qwen35_4b"]
qwen35_9b = ["paramecia-engine/qwen35_9b"]
qwen35_27b = ["paramecia-engine/qwen35_27b"]
qwen38_27b = ["paramecia-engine/qwen38_27b"]
cuda = ["paramecia-engine/cuda"]

[dependencies]
async-trait = "0.1"
black-hole-contract = { path = "../_black_hole_contract" }
black-hole-spec = { path = "../_black_hole_spec" }
clap = { version = "4", features = ["derive"] }
directories-next = "2"
paramecia-engine = { git = "https://github.com/nicksenger/paramecia.git", branch = "blackholesun" }
postcard = { version = "1", features = ["alloc"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
