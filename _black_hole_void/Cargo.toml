[package]
name = "black-hole-void"
description = "Object storage for black-hole-sun"
version = "0.1.0"
edition = "2021"

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]

[dependencies]
aws-sdk-s3 = "1.140"
black-hole-type = { path = "../_black_hole_type" }
clap = { version = "4", features = ["derive"] }
directories-next = "2"
futures = "0.3"
fjall = "3"
postcard = { version = "1", features = ["alloc"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Always needed (traits used by both in-memory and postgres backends)
async-trait = "0.1"
dyn-clone = "1"

# Postgres feature dependencies
sqlx = { version = "0.8", optional = true, features = ["postgres", "runtime-tokio-rustls", "uuid"] }

[lints]
workspace = true

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
