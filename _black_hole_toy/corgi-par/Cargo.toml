[package]
name = "corgi-par"
description = "Example: pipeline- and data-parallel ResNet-18 training"
version = "0.1.0"
edition = "2021"

# Standalone crate — not a member of the parent workspace
[workspace]

[dependencies]
async-trait = "0.1"
black-hole-beam = { path = "../../_black_hole_beam" }
black-hole-sun = { path = "../../black-hole-sun" }
black-hole-toy-common = { path = "../common", features = ["dataset"] }
candle = { path = "../../../candle/candle-core", package = "candle-core", version = "0.11.0" }
candle-nn = { path = "../../../candle/candle-nn", version = "0.11.0" }
clap = { version = "4", features = ["derive"] }
corgi-bwd = { path = "../corgi-bwd" }
corgi-fwd = { path = "../corgi-fwd" }
jungle-sdk = { git = "https://github.com/nicksenger/Jungle.git", branch = "blackholesun", features = ["fjall", "fusion"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
typenum = "1"
uuid = { version = "1", features = ["v4"] }
