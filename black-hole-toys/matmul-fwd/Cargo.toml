[package]
name = "matmul-fwd"
description = "Example: matmul forward pass"
version = "0.1.0"
edition = "2021"

# Standalone crate — not a member of the parent workspace
[workspace]

[dependencies]
async-trait = "0.1"
black-hole-flux = { path = "../../_black_hole_flux" }
black-hole-sun = { path = "../../black-hole-sun" }
jungle-sdk = { git = "https://github.com/nicksenger/Jungle.git", branch = "blackholesun", features = ["fjall", "fusion"] }
postcard = { version = "1", features = ["alloc"] }
serde = "1"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
typenum = "1"
uuid = { version = "1", features = ["v4"] }
